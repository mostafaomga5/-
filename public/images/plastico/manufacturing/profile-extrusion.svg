<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <pattern id="grid_pipe" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  </pattern>
      <radialGradient id="glow_pipe" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="800" height="500" fill="#0B0F19"/>
    <rect width="800" height="500" fill="url(#grid_pipe)"/>
    <rect width="800" height="500" fill="url(#glow_pipe)"/>
    <!-- Architectural Frame Lines -->
    <rect x="28" y="28" width="744" height="444" rx="16" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
    <line x1="28" y1="72" x2="772" y2="72" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="54" cy="50" r="5" fill="#0284C7"/>
    <circle cx="74" cy="50" r="5" fill="#F97316"/>
    <circle cx="94" cy="50" r="5" fill="#334155"/>
    
        <!-- Pipe & Profile Extrusion Line -->
        <rect x="85" y="210" width="160" height="90" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
        <polygon points="120,140 175,140 160,210 135,210" fill="#172554" stroke="#0284C7" stroke-width="2"/>
        <!-- Die Head -->
        <rect x="245" y="228" width="55" height="54" rx="4" fill="#334155" stroke="#F97316" stroke-width="2"/>
        <!-- Extruded Continuous Pipe -->
        <rect x="300" y="238" width="410" height="34" fill="#0284C7" fill-opacity="0.3" stroke="#0284C7" stroke-width="2.5"/>
        <line x1="300" y1="247" x2="710" y2="247" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.6"/>
        <!-- Vacuum Calibration Tank & Haul-off -->
        <rect x="355" y="205" width="155" height="100" rx="6" fill="#0F172A" fill-opacity="0.75" stroke="#38BDF8" stroke-width="2"/>
        <rect x="555" y="208" width="95" height="94" rx="6" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      
  </svg>