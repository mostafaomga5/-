    <line x1="28" y1="72" x2="772" y2="72" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="54" cy="50" r="5" fill="#0EA5E9"/>
    <circle cx="74" cy="50" r="5" fill="#F97316"/>
    <circle cx="94" cy="50" r="5" fill="#334155"/>
    
        <!-- Blow Molding Extruder Head & Parison Drop -->
        <rect x="260" y="90" width="280" height="65" rx="8" fill="#1E293B" stroke="#0EA5E9" stroke-width="2"/>
        <rect x="375" y="155" width="50" height="40" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
        <!-- Left & Right Mold Halves -->
