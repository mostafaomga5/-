        <rect x="440" y="200" width="110" height="190" rx="8" fill="#151D2E" stroke="#0EA5E9" stroke-width="2"/>
        <!-- Hollow Molded Container Inside -->
        <path d="M 385 195 L 415 195 L 420 225 L 432 245 L 432 365 C 432 378 420 385 400 385 C 380 385 368 378 368 365 L 368 245 L 380 225 Z" fill="#F97316" fill-opacity="0.28" stroke="#F97316" stroke-width="2.5"/>
