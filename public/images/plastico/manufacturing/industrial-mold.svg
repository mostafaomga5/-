<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <pattern id="grid_mold" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  </pattern>
      <radialGradient id="glow_mold" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="800" height="500" fill="#0B0F19"/>
    <rect width="800" height="500" fill="url(#grid_mold)"/>
    <rect width="800" height="500" fill="url(#glow_mold)"/>
