        <rect x="225" y="130" width="350" height="240" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
        <!-- Guide Pillars -->
        <circle cx="212" cy="118" r="11" fill="#475569" stroke="#CBD5E1" stroke-width="2"/>
        <circle cx="588" cy="118" r="11" fill="#475569" stroke="#CBD5E1" stroke-width="2"/>
