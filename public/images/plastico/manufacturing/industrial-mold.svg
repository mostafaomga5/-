    <circle cx="54" cy="50" r="5" fill="#38BDF8"/>
    <circle cx="74" cy="50" r="5" fill="#F97316"/>
    <circle cx="94" cy="50" r="5" fill="#334155"/>
    
        <!-- High Precision Multi-Cavity Steel Injection Mold -->
