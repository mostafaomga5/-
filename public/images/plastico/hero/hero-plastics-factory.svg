<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
    <defs>
      <pattern id="grid_hero-factory" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  </pattern>
      <radialGradient id="glow_hero-factory" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="800" height="500" fill="#0B0F19"/>
    <rect width="800" height="500" fill="url(#grid_hero-factory)"/>
    <rect width="800" height="500" fill="url(#glow_hero-factory)"/>
    <!-- Architectural Frame Lines -->
    <rect x="28" y="28" width="744" height="444" rx="16" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>
    <line x1="28" y1="72" x2="772" y2="72" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="54" cy="50" r="5" fill="#2563EB"/>
    <circle cx="74" cy="50" r="5" fill="#F97316"/>
    <circle cx="94" cy="50" r="5" fill="#334155"/>
    
        <!-- Factory Perspective Hall & CNC Injection Line -->
        <rect x="70" y="130" width="660" height="240" rx="12" fill="#111726" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <!-- Clamping Unit Left -->
        <rect x="105" y="165" width="170" height="170" rx="8" fill="#172033" stroke="#2563EB" stroke-width="2"/>
        <line x1="275" y1="190" x2="430" y2="190" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
        <line x1="275" y1="310" x2="430" y2="310" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
        <!-- Moving & Fixed Platens + Steel Mold -->
        <rect x="315" y="172" width="32" height="156" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
        <rect x="349" y="184" width="38" height="132" rx="3" fill="#F97316" fill-opacity="0.25" stroke="#F97316" stroke-width="2"/>
        <rect x="389" y="172" width="32" height="156" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
        <!-- Injection Unit & Hopper Right -->
        <rect x="425" y="222" width="210" height="56" rx="6" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
        <polygon points="520,145 580,145 562,222 538,222" fill="#2563EB" fill-opacity="0.3" stroke="#2563EB" stroke-width="2"/>
        <!-- Molten Polymer Flow Channel -->
        <path d="M 430 250 L 368 250" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
        <circle cx="368" cy="250" r="14" fill="#F97316" fill-opacity="0.35"/>
        <circle cx="368" cy="250" r="6" fill="#F97316"/>
        <!-- Robotic Takeout Arm -->
        <path d="M 368 110 L 368 180 M 320 110 L 460 110" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
        <circle cx="368" cy="110" r="9" fill="#0EA5E9"/>
        <!-- Control Console -->
        <rect x="445" y="165" width="52" height="44" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
        <path d="M 455 195 L 465 182 L 476 188 L 488 175" fill="none" stroke="#10B981" stroke-width="2"/>
      
  </svg>